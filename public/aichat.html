<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI 聊天 - CWJ Tools</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#0b0b0b;color:#fff;padding:20px}
    .card{background:#111;padding:20px;border-radius:8px;max-width:800px;margin:0 auto}
    textarea,input,select{width:100%;padding:10px;border-radius:6px;border:1px solid #333;background:#0b0b0b;color:#fff}
    button{padding:10px 16px;border-radius:6px;border:none;background:#6a5acd;color:#fff;cursor:pointer}
    .result{white-space:pre-wrap;background:#0b0b0b;padding:12px;border-radius:6px;border:1px solid #222;margin-top:10px}
    .error{color:#ff6666}
  </style>
</head>
<body>
  <div class="card">
    <h1>AI 聊天 — CWJ Tools</h1>
    <textarea id="chat_input" rows="4" maxlength="500" placeholder="输入你想问的内容..."></textarea>
    <div style="margin-top:8px"><button id="send">发送</button></div>

    <div id="status" style="margin-top:12px"></div>
    <div id="result" class="result" style="display:none"></div>
  </div>

  <script>
    const sendBtn = document.getElementById('send');
    const inputEl = document.getElementById('chat_input');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');

    async function send() {
      const text = inputEl.value.trim();
      if (!text) { statusEl.textContent = '请输入问题'; return; }
      statusEl.textContent = '正在发送...';
      resultEl.style.display = 'none';
      try {
        const resp = await fetch('/api/aichat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        const data = await resp.json();
        if (resp.ok) {
          resultEl.textContent = data.reply;
          resultEl.style.display = 'block';
          statusEl.textContent = '';
        } else {
          statusEl.textContent = data.error || '服务器返回错误';
        }
      } catch (e) {
        statusEl.textContent = '请求失败，请检查网络或稍后重试';
      }
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.ctrlKey) send(); });
  </script>
</body>
</html>
