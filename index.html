<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
    <title>CWJ TOOLS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        :root{--bg:#000;--card:#111116;--card2:#1a1a22;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.18);--text:#f5f5f7;--muted:#86868b;--blue:#2997ff;--green:#30d158;--purple:#bf5af2;--orange:#ff9f0a;--red:#ff453a;}
        html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,'Noto Sans SC',sans-serif;overflow:hidden;}
        canvas#bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
        .app{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative;}
        .topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0.9rem 1.2rem 0.7rem;background:rgba(0,0,0,0.72);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:0.5px solid var(--border);position:relative;z-index:10;}
        .topbar-logo{font-size:1.1rem;font-weight:700;letter-spacing:0.06em;}
        .topbar-logo span{color:var(--blue);}
        .theme-btn{background:none;border:none;color:var(--muted);font-size:1rem;cursor:pointer;padding:4px;}
        .pages{flex:1;overflow:hidden;position:relative;z-index:1;}
        .page{position:absolute;inset:0;overflow-y:auto;padding:1rem 1rem 1.5rem;opacity:0;pointer-events:none;transform:translateY(16px);transition:opacity 0.35s ease,transform 0.35s ease;}
        .page.active{opacity:1;pointer-events:all;transform:none;}
        .card{background:var(--card);border:0.5px solid var(--border);border-radius:18px;padding:1.3rem;margin-bottom:0.9rem;}
        input[type=text],textarea{width:100%;background:var(--card2);border:0.5px solid var(--border);border-radius:12px;padding:0.8rem 1rem;color:var(--text);font-size:0.95rem;font-family:inherit;outline:none;-webkit-appearance:none;}
        .btn{width:100%;padding:0.85rem;border:none;border-radius:14px;font-size:0.95rem;font-weight:600;cursor:pointer;margin-top:0.8rem;display:flex;align-items:center;justify-content:center;gap:0.5rem;}
        .btn:active{transform:scale(0.94);}
        .btn-blue{background:linear-gradient(135deg,#2997ff,#0071e3);color:#fff;box-shadow:0 4px 15px rgba(41,151,255,0.3);}
        .result-box{background:var(--card2);border:0.5px solid var(--border);border-radius:12px;padding:0.9rem 1rem;margin-top:0.8rem;font-size:0.85rem;word-break:break-all;min-height:52px;position:relative;}
        .result-box.hidden{display:none;}
        .copy-btn{position:absolute;top:8px;right:8px;background:rgba(255,255,255,0.1);border:none;border-radius:8px;color:var(--muted);padding:4px 10px;font-size:0.72rem;}
    </style>
</head>
<body>
    <canvas id="bg"></canvas>
    <div class="app">
        <div class="topbar">
            <div class="topbar-logo">CWJ<span>.</span>TOOLS</div>
            <div class="topbar-right">
                <button class="theme-btn" onclick="toggleTheme()" id="themeBtn"><i class="fa-solid fa-moon"></i></button>
                <div class="topbar-badge">ONLINE</div>
            </div>
        </div>
        <div class="pages">
            <div class="page active" id="page-home">
                <div style="text-align:center;padding:2rem 1rem 1.5rem;background:linear-gradient(160deg,rgba(41,151,255,0.07),rgba(191,90,242,0.05));border-radius:20px;margin-bottom:1rem;">
                    <div style="font-size:2rem;font-weight:700;line-height:1.15;">工具从未<br><span style="background:linear-gradient(135deg,#2997ff,#bf5af2,#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">如此优雅</span></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;">
                    <div class="card" onclick="goTab('pwd')"><div style="font-size:1.6rem;">🔑</div><div>密码生成</div></div>
                    <div class="card" onclick="goTab('weather')"><div style="font-size:1.6rem;">🌤️</div><div>实时天气</div></div>
                    <div class="card" onclick="goTab('hash')"><div style="font-size:1.6rem;">#️⃣</div><div>哈希计算</div></div>
                    <div class="card" onclick="goTab('crypto')"><div style="font-size:1.6rem;">🔐</div><div>文本加密</div></div>
                </div>
            </div>
            <div class="page" id="page-pwd">
                <div class="card"><div class="card-title blue">密码生成器</div><input type="range" id="pwdLen" min="6" max="64" value="16" oninput="genPwd()">
                <div class="result-box" id="pwdResult"><span id="pwdText"></span></div></div>
            </div>
            <div class="page" id="page-weather"><div class="card"><input type="text" id="cityInput" placeholder="输入城市名"><button class="btn btn-blue" onclick="getWeather()">查询</button></div><div id="weatherResult"></div></div>
            <div class="page" id="page-crypto"><div class="card"><textarea id="cryptoInput"></textarea><button class="btn" onclick="doCrypto('enc')">加密</button><div class="result-box hidden" id="cryptoResult"><span id="cryptoText"></span></div></div></div>
            <div class="page" id="page-qr"><div class="card"><input type="text" id="qrInput"><button class="btn btn-blue" onclick="genQR()">生成二维码</button><div class="qr-wrap" id="qrWrap"></div></div></div>
            <div class="page" id="page-text"><div class="card"><textarea id="textInput" oninput="countText()"></textarea><div id="charCount">0</div></div></div>
        <div class="tabbar">
            <div class="tab active" id="tab-home" onclick="goTab('home')"><i class="fa-solid fa-house"></i>首页</div>
            <div class="tab" id="tab-pwd" onclick="goTab('pwd')"><i class="fa-solid fa-key"></i>密码</div>
            <div class="tab" id="tab-weather" onclick="goTab('weather')"><i class="fa-solid fa-cloud-sun"></i>天气</div>
            <div class="tab" id="tab-hash" onclick="goTab('hash')"><i class="fa-solid fa-fingerprint"></i>哈希</div>
            <div class="tab" id="tab-crypto" onclick="goTab('crypto')"><i class="fa-solid fa-shield-halved"></i>加密</div>
            <div class="tab" id="tab-qr" onclick="goTab('qr')"><i class="fa-solid fa-qrcode"></i>二维码</div>
            <div class="tab" id="tab-ip" onclick="goTab('ip')"><i class="fa-solid fa-globe"></i>IP</div>
            <div class="tab" id="tab-text" onclick="goTab('text')"><i class="fa-solid fa-text-width"></i>文字</div>
            <div class="tab" id="tab-color" onclick="goTab('color')"><i class="fa-solid fa-palette"></i>颜色</div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
        const canvas=document.getElementById('bg');const ctx=canvas.getContext('2d');let W,H,particles=[];
        function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
        resize();window.addEventListener('resize',resize);
        class P{constructor(){this.reset();}reset(){this.x=Math.random()*W;this.y=Math.random()*H;this.r=Math.random()*1.2+0.3;this.vx=(Math.random()-0.5)*0.25;this.vy=(Math.random()-0.5)*0.25;this.a=Math.random()*0.4+0.1;}update(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>W||this.y<0||this.y>H)this.reset();}draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${this.a})`;ctx.fill();}}
        for(let i=0;i<80;i++)particles.push(new P());
        function animP(){ctx.clearRect(0,0,W,H);particles.forEach(p=>{p.update();p.draw();});requestAnimationFrame(animP);}
        animP();
        function toggleTheme(){let isL=document.documentElement.style.getPropertyValue('--bg')==='#f5f5f7';document.documentElement.style.setProperty('--bg',isL?'#000':'#f5f5f7');document.documentElement.style.setProperty('--text',isL?'#f5f5f7':'#1d1d1f');}
        function goTab(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('page-'+n).classList.add('active');document.getElementById('tab-'+n).classList.add('active');}
        function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
        // 省略后续逻辑：如 genPwd, getWeather, doCrypto 等函数请保留你之前的完整版逻辑
    </script>
</body>
</html>
